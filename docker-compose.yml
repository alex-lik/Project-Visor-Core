services:
  visor:
    build:
      context: .
      dockerfile: Dockerfile
      # Прод-стадия мультистейдж-сборки (deps → builder → runner).
      # Кэши BuildKit (npm + .next/cache) делают повторный
      # `docker compose build` быстрым при правках только в src/.
      target: runner
    container_name: project_visor_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=visor-super-secret-key-change-in-production-2026
      - DATABASE_URL=file:/app/data/visor.db
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - ./data:/app/data
    networks:
      - visor-network

  # Optional Prometheus service
  prometheus:
    image: prom/prometheus:latest
    container_name: project_visor_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - visor-network

networks:
  visor-network:
    driver: bridge

volumes:
  prometheus_data:
